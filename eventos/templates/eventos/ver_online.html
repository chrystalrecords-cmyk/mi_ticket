<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reproductor - MiTicket</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-dark text-light d-flex flex-column align-items-center justify-content-center min-vh-100 p-4">

    <div class="container" style="max-width: 800px;">
        
        <div class="text-center mb-4">
            <h2 class="fw-bold">{{ orden.evento.nombre }}</h2>
            <p class="text-muted">Orden #{{ orden.id }} | Acceso Exclusivo</p>
        </div>

        <!-- Reproductor de video con permisos de seguridad para YouTube -->
        <div class="ratio ratio-16x9 shadow-lg rounded-4 overflow-hidden mb-4 bg-black">
            <iframe src="{{ orden.evento.link_video }}" 
                    title="Contenido Exclusivo" 
                    allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture" 
                    referrerpolicy="strict-origin-when-cross-origin" 
                    allowfullscreen>
            </iframe>
        </div>

        <div class="text-center">
            <a href="{% url 'lista_eventos' %}" class="btn btn-outline-secondary fw-bold px-4">Volver al Inicio</a>
        </div>

    </div>

</body>
</html>
