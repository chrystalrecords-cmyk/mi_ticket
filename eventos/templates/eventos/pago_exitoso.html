<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>¡Pago Exitoso! - MiTicket</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light d-flex align-items-center justify-content-center min-vh-100">

    <div class="card text-center shadow-lg p-5 border-0 rounded-4" style="max-width: 500px; width: 100%;">
        <div class="mb-3 display-1 text-success">
            ✅
        </div>
        <h2 class="fw-bold text-dark">¡Pago Confirmado!</h2>
        <p class="text-muted fs-5">Gracias por tu compra, <strong>{{ orden.nombre_comprador }}</strong>.</p>
        <p class="text-secondary small">Tu número de orden es <strong>#{{ orden.id }}</strong>.</p>
        
        <hr class="my-4">

        <a href="{% url 'ver_ticket' orden.id %}" class="btn btn-success btn-lg fw-bold w-100 shadow-sm">
            🎟️ Ver y Descargar mi Ticket
        </a>
        
        <a href="{% url 'lista_eventos' %}" class="btn btn-link text-decoration-none text-muted mt-2">
            Volver a la lista de eventos
        </a>
    </div>

</body>
</html>
