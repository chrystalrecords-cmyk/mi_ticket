<div class="row">
            {% for producto in productos %}
            <div class="col-md-4 mb-4">
                <div class="card bg-dark text-white h-100 border-secondary shadow">
                    {% if producto.imagen %}
                        <img src="{{ producto.imagen.url }}" class="card-img-top" alt="{{ producto.nombre }}" style="height: 250px; object-fit: cover;">
                    {% endif %}
                    <div class="card-body d-flex flex-column text-center">
                        <h5 class="card-title text-warning">{{ producto.nombre }}</h5>
                        <p class="card-text text-muted flex-grow-1">{{ producto.descripcion }}</p>
                        <p class="fw-bold fs-5 text-success">$ {{ producto.precio }}</p>
                        <a href="#" class="btn btn-primary mt-auto">Comprar / Reservar</a>
                    </div>
                </div>
            </div>
            {% empty %}
            <div class="col-12 text-center">
                <p class="text-muted">Próximamente nuevos productos disponibles.</p>
            </div>
            {% endfor %}
        </div>
