<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>¡Ticket Confirmado!</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">

    <div class="container py-5">
        <div class="row justify-content-center">
            <div class="col-md-6 col-lg-5">
                <div class="card shadow-lg border-0 border-top border-5 border-success text-center">
                    <div class="card-body p-4">
                        <div class="display-1 text-success mb-2">🎉</div>
                        <h2 class="card-title fw-bold">¡Compra Exitosa!</h2>
                        <p class="text-muted">Gracias <strong class="text-dark">{{ nombre }}</strong> por tu compra.</p>
                        <hr>
                        <h4 class="h6 text-uppercase text-muted">Resumen del Ticket</h4>
                        <p class="mb-1 fs-5"><strong>Evento:</strong> {{ evento.nombre }}</p>
                        <p class="mb-1"><strong>Cantidad:</strong> {{ cantidad }} entrada(s)</p>
                        <p class="fs-4 text-success fw-bold my-2">Monto Total: ${{ total }}</p>
                        <hr>
                        <p class="small text-muted mb-4">Enviamos la confirmación a tu correo.</p>
                        <a href="{% url 'lista_eventos' %}" class="btn btn-primary w-100 py-2">Volver al Inicio</a>
                    </div>
                </div>
            </div>
        </div>
    </div>

</body>
</html>
