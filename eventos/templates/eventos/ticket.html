<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tu Ticket - {{ orden.evento.nombre }}</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-dark text-light d-flex align-items-center justify-content-center min-vh-100">

    <div class="card bg-white text-dark shadow-lg rounded-4 p-4" style="max-width: 420px; width: 100%;">
        <div class="text-center pb-3 border-bottom">
            <h5 class="text-primary fw-bold mb-0">MiTicket</h5>
            <small class="text-muted">Entrada Oficial</small>
        </div>

        <div class="text-center my-3">
            <h3 class="fw-bold text-dark mb-1">{{ orden.evento.nombre }}</h3>
            <p class="text-muted mb-0">📍 {{ orden.evento.lugar }}</p>
            <p class="text-muted small">📅 {{ orden.evento.fecha }}</p>
        </div>

        <div class="text-center my-3 p-3 bg-light rounded border">
            <img src="data:image/png;base64,{{ qr_code }}" alt="Código QR Ticket" class="img-fluid" style="max-width: 200px;">
            <p class="small text-muted mt-2 mb-0">Orden #{{ orden.id }}</p>
        </div>

        <div class="border-top pt-3">
            <p class="mb-1"><strong>Titular:</strong> {{ orden.nombre_comprador }}</p>
            <p class="mb-1"><strong>Email:</strong> {{ orden.email_comprador }}</p>
            <p class="mb-0"><strong>Cantidad de Entradas:</strong> {{ orden.cantidad }}</p>
        </div>

        <button onclick="window.print()" class="btn btn-primary w-100 mt-4 fw-bold">Imprimir / Guardar PDF</button>
    </div>

</body>
</html>
